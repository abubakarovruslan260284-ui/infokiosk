[package]
name = "kiosk_cards"
version = "0.1.0"
edition = "2021"
description = "Служба карточек товаров для инфокиоска: Google Диск -> 1С -> InfoContent"

[[bin]]
name = "kiosk_cards"
path = "src/main.rs"

[dependencies]
kiosk_sync = { path = "../../src-tauri/kiosk_sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rxing = { version = "0.8", default-features = false, features = ["encoding_rs"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
# значок в области уведомлений (возле часов): состояние службы и меню
tray-icon = "0.21"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_Security",
] }

[profile.release]
opt-level = 3
strip = true
